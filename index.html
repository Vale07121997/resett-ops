<style>
/* Layout: single mobile-first column, one task per screen, sticky header with sync state. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14181f; --muted:#5b6573; --line:#d5dbe2;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --ok:#137a43; --ok-soft:#dcf2e5; --warn:#9a5b00; --warn-soft:#fdf0d6; --bad:#b4232a; --bad-soft:#fbe1e2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#181e26; --ink:#e7ebf0; --muted:#9aa5b3; --line:#2b3440;
  --accent:#7c9cff; --accent-ink:#0b1020; --accent-soft:#1e2a4a;
  --ok:#5fd18f; --ok-soft:#14301f; --warn:#f0b54d; --warn-soft:#33270f; --bad:#ff7d7d; --bad-soft:#3a1619; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#181e26; --ink:#e7ebf0; --muted:#9aa5b3; --line:#2b3440;
  --accent:#7c9cff; --accent-ink:#0b1020; --accent-soft:#1e2a4a;
  --ok:#5fd18f; --ok-soft:#14301f; --warn:#f0b54d; --warn-soft:#33270f; --bad:#ff7d7d; --bad-soft:#3a1619; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.85);border-radius:12px;transition:border-color .15s}
.cam.hit .frame{border-color:#3ddc84}
.cam .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px #000}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-weight:700;letter-spacing:.02em;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.sync{font-size:12px;padding:3px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
.sync.ok{background:var(--ok-soft);color:var(--ok)} .sync.local{background:var(--warn-soft);color:var(--warn)} .sync.err{background:var(--bad-soft);color:var(--bad)}
main{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;text-wrap:balance} h2{font-size:17px;margin:0} p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 0;min-width:0}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.okb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
button:disabled{opacity:.45;cursor:not-allowed}
.block{width:100%}
.note{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--accent-soft);color:var(--ink)}
.note b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
.counter{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:6px}
.counter .n{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.counter .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.bar.over i{background:var(--bad)} .bar.full i{background:var(--ok)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600}
.sku{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qty{font-family:var(--mono);font-weight:600;font-size:18px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.chip{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.chip.open{background:var(--warn-soft);color:var(--warn)} .chip.closed{background:var(--ok-soft);color:var(--ok)} .chip.man{background:var(--accent-soft);color:var(--accent)} .chip.unk{background:var(--bad-soft);color:var(--bad)}
.boxrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;min-height:0;font-weight:400}
.boxrow:first-child{border-top:0}
.boxno{font-family:var(--mono);font-weight:700;font-size:18px;min-width:3.2em}
.scanin{font-family:var(--mono);font-size:18px;text-align:center;border:2px dashed var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:min(92vw,560px);padding:12px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.ok{background:var(--ok);color:var(--surface)} .toast.warn{background:var(--warn);color:var(--surface)} .toast.bad{background:var(--bad);color:var(--surface)}
.flash{animation:fl .5s}
@keyframes fl{from{background:var(--ok-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.bar i{transition:none}}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.steps span{padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.steps span.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 12px}
.seg button.on{background:var(--ink);color:var(--surface)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.bigbox{font-family:var(--mono);font-size:44px;font-weight:700;text-align:center;letter-spacing:.04em}
</style>
</head><body>

<header class="top"><div class="topin">
  <div class="brand">Action Wear · NY Pack-Out<small id="who">—</small></div>
  <span id="sync" class="sync local">Starting…</span>
</div></header>
<main id="app"><div class="panel"><p class="muted">Loading…</p></div></main>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Supabase config ---------- */
const SUPABASE_URL="https://xmityeuypjhpxgdasaii.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_EerBuzFBP7FU4-MRMifCEg_wPOIT_3i";

/* ---------- Catalog (SKU guide: style + color(3) + size(2)) ---------- */
const STYLES={"10110":"Sport Bra","10114":"Sport Bra U","10115":"Square Neck Bra","10123":"Low Cross Top","10126":"One Shoulder Sport Bra","10127":"Parfait Sport Bra","10128":"Contrast Halter Top","10129":"High Sport Bra","10130":"Racerback Seamless","10131":"Sculpt Seamless","10132":"Square Bra","10133":"Square Blis","10135":"Ballerina Sport Bra","1018":"Strappy Bra","1019":"Well Bra","1031":"Performance Tee (Women)","1036":"Strappy T-Shirt","1037":"Quarter Zip Crop","1043":"Performance Tank (Women)","1052":"Oversized Zip Neck","1053":"Crop Jacket","10613":"Parfait High Waist Biker","10618":"Side Cuts Biker","1067":"Mini Short Sens 3\"","1068":"Mini Short Sens 3\"","1071":"Biker Pocket Sens","1084":"High Waist Leggings Sens","1087":"Leggings Pocket Suplex","10913":"Parfait High Waist Leggings","10914":"Flare Power Leggings","1172":"Sleek Skirt","1192":"Strappy Romper Sens","1193":"Quarter Zip Jumpsuit Biker","1194":"Streep Contrast Jumpsuit","2037":"Performance Tee (Men)","2042":"Performance Tank (Men)","2043":"High Neck Tank (Men)","3113":"Bandage Gloves"};
const COLORS={"000":"White","013":"Black","020":"Latte","021":"Ivory","022":"Stone","023":"Navy","027":"Wine","029":"Mushroom","033":"Chocolate","034":"Cosmic Grey","035":"Macadamia","039":"Merlot","041":"Night Blue","057":"Black Smoke","064":"Mermaid","067":"Canyon","068":"Gulf Coast","069":"Tourmaline","075":"Silver Mist","076":"Willow","078":"Plum Purple","611":"Dark Lilac"};
const SIZES={"XS":"XS","SS":"S","MM":"M","LL":"L","XL":"XL","SM":"S/M","UU":"One size"};
const SIZE_CODE={"XS":"XS","S":"SS","M":"MM","L":"LL","XL":"XL","S/M":"SM","One size":"UU"};
const MAX_PILE=60;

function decodeSku(sku){
  const m=/^(\d{6,9})(XS|SS|MM|LL|XL|SM|UU)$/.exec(sku); if(!m) return null;
  const digits=m[1], color=digits.slice(-3), style=digits.slice(0,-3);
  return {sku, style, color, size:m[2], name:STYLES[style]||null, colorName:COLORS[color]||("Color "+color), sizeName:SIZES[m[2]]};
}
function parseCode(raw){
  const s=String(raw||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!s) return null;
  const direct=decodeSku(s); if(direct) return direct;
  const m=/(\d{6,9})(XS|SS|MM|LL|XL|SM|UU)(?![A-Z0-9])/.exec(s);
  return m? decodeSku(m[1]+m[2]) : null;
}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const now=()=>Date.now();
const fmtT=t=>t?new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clientId=(()=>{let id=ls.get("nyp_client",null);if(!id){id="c"+Math.random().toString(36).slice(2,10);ls.set("nyp_client",id)}return id})();
function scannedOf(b){return Object.values(b.items||{}).reduce((a,i)=>a+(i.qty||0),0)}
let toastT;
function toast(msg,kind="ok",ms=2200){const t=$("#toast");t.textContent=msg;t.className="toast "+kind;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}
let actx;
function beep(ok=true){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=ok?1320:300;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(ok?.08:.25))}catch(e){} try{navigator.vibrate&&navigator.vibrate(ok?40:[80,60,80])}catch(e){}}

/* ---------- State ---------- */
const S={name:ls.get("nyp_name",""),location:ls.get("nyp_loc",""),view:"welcome",boxes:new Map(),issues:new Map(),cur:null,mode:"local",sync:"local",undo:[],closeStep:null,unit:ls.get("nyp_unit","in"),viewBox:null,issueDraft:null,lastScan:{code:"",t:0},kbd:false};

/* ---------- Store (shared db when available, else this device) ---------- */
let sb=null, db=null;
const store={
  async saveBox(b){ cacheLocal(); if(!sb) return; const {error}=await sb.from("ny_boxes").upsert({id:b.id,data:b,updated_at:new Date().toISOString()}); if(error) throw {code:"unavailable",message:error.message}; },
  async deleteBox(id){ cacheLocal(); if(!sb) return; const {error}=await sb.from("ny_boxes").delete().eq("id",id); if(error) throw {code:"unavailable",message:error.message}; },
  async saveIssue(i){ cacheLocal(); if(!sb) return; const {error}=await sb.from("ny_issues").upsert({id:i.id,data:i,created_at:new Date(i.createdAt).toISOString()}); if(error) throw {code:"unavailable",message:error.message}; }
};
function cacheLocal(){ ls.set("nyp_local",{boxes:[...S.boxes.values()],issues:[...S.issues.values()]}); }
function persistLocal(){ cacheLocal(); }
function loadLocal(){ const d=ls.get("nyp_local",{boxes:[],issues:[]}); (d.boxes||[]).forEach(b=>S.boxes.set(b.id,b)); (d.issues||[]).forEach(i=>S.issues.set(i.id,i)); }
const wq={};
function saveBox(b){ b.updatedAt=now(); S.boxes.set(b.id,b); const q=wq[b.id]||(wq[b.id]={busy:false,dirty:false}); q.dirty=true; if(!q.busy) flush(b.id); }
async function flush(id){
  const q=wq[id]; q.busy=true; let tries=0;
  while(q.dirty){ q.dirty=false; const b=S.boxes.get(id); if(!b) break;
    try{ await store.saveBox(b); setSync(db?"ok":"local"); tries=0; }
    catch(e){ const c=e&&e.code; setSync("err",c==="quota_exceeded"?"Storage full — tell Colombia":"Not saved — check internet");
      if(c==="invalid_argument"){ break; }
      q.dirty=true; tries++; await sleep(Math.min(8000,1000*tries)+Math.random()*400); }
  }
  q.busy=false;
}
function pending(id){const q=wq[id];return q&&(q.busy||q.dirty)}
function setSync(s,msg){S.sync=s;const el=$("#sync");if(!el)return;el.className="sync "+(s==="ok"?"ok":s==="err"?"err":"local");el.textContent=s==="ok"?"Synced with Colombia":s==="err"?(msg||"Not saved"):"This device only"}

async function pullAll(){
  if(!sb) return;
  const [bx,is]=await Promise.all([sb.from("ny_boxes").select("id,data"),sb.from("ny_issues").select("id,data")]);
  if(bx.error||is.error){ setSync("err","Can't reach the server — check internet"); return; }
  const seen=new Set();
  bx.data.forEach(r=>{ seen.add(r.id); if(pending(r.id)) return; const loc=S.boxes.get(r.id); if(loc&&(loc.updatedAt||0)>(r.data.updatedAt||0)){ saveBox(loc); return; } S.boxes.set(r.id,r.data); });
  [...S.boxes.keys()].forEach(id=>{ if(!seen.has(id)&&!pending(id)){ const b=S.boxes.get(id); if(b.packer===S.name&&b._local) saveBox(b); else S.boxes.delete(id); } });
  is.data.forEach(r=>S.issues.set(r.id,r.data));
  [...S.issues.values()].forEach(i=>{ if(!is.data.find(r=>r.id===i.id)&&i.reporter===S.name) store.saveIssue(i).catch(()=>{}); });
  cacheLocal(); if(S.sync!=="err"||navigator.onLine) setSync("ok");
}
async function init(){
  loadLocal(); render();
  if(window.supabase&&!SUPABASE_URL.startsWith("__")){
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}});
    db=true; S.mode="sync";
    await pullAll();
    sb.channel("ny-packout").on("postgres_changes",{event:"*",schema:"public",table:"ny_boxes"},p=>{ const r=p.new&&p.new.id?p.new:null; const id=(p.new&&p.new.id)||(p.old&&p.old.id); if(!id||pending(id)) return; if(p.eventType==="DELETE") S.boxes.delete(id); else if(r) S.boxes.set(id,r.data); cacheLocal(); liveRefresh(); })
      .on("postgres_changes",{event:"*",schema:"public",table:"ny_issues"},p=>{ if(p.new&&p.new.id){ S.issues.set(p.new.id,p.new.data); cacheLocal(); liveRefresh(); } }).subscribe();
    setInterval(()=>pullAll().then(liveRefresh),20000);
    window.addEventListener("online",()=>{ pullAll().then(liveRefresh); Object.keys(wq).forEach(id=>{ if(!wq[id].busy&&S.boxes.get(id)) saveBox(S.boxes.get(id)); }); });
  } else { S.mode="local"; setSync("local"); }
  S.view=S.name?"home":"welcome";
  render();
}
function liveRefresh(){ if(["home","summary","issues","boxview"].includes(S.view)) render(); else if(S.view==="scan") renderScanParts(); }

/* ---------- Box numbering ---------- */
async function nextBoxNumber(){
  const maxLocal=Math.max(0,...[...S.boxes.values()].map(b=>b.number||0));
  if(!sb) return maxLocal+1;
  try{ const {data,error}=await sb.rpc("ny_next_box"); if(!error&&data) return Math.max(+data,maxLocal+1); }catch(e){}
  toast("Offline: box number may repeat. Check before writing it on the box","warn",4000);
  return maxLocal+1;
}

/* ---------- Views ---------- */
function stepper(on){const st=["Count","Scan & pack","Check","Measure & weigh"];return `<div class="steps">${st.map((s,i)=>`<span class="${i===on?"on":""}">${i+1}. ${s}</span>`).join("")}</div>`}
function modeNote(){ return S.mode==="local"?`<div class="note warn"><b>Not connected to the server.</b><span>Work is saved on this phone only. When you finish, download the Excel from “My summary” and send it to Colombia. Don't clear this browser's data until then.</span></div>`:""; }

function render(){
  $("#who").textContent=S.name?`${S.name}${S.location?" · "+S.location:""}`:"Packing list & box count";
  const app=$("#app"); const v=S.view;
  if(v==="welcome") app.innerHTML=vWelcome();
  else if(v==="home") app.innerHTML=vHome();
  else if(v==="count") app.innerHTML=vCount();
  else if(v==="scan"){ app.innerHTML=vScan(); renderScanParts(); if(CAM.on) attachCam(); else focusScan(); }
  else if(v==="close") app.innerHTML=vClose();
  else if(v==="dims") app.innerHTML=vDims();
  else if(v==="boxdone") app.innerHTML=vBoxDone();
  else if(v==="manual") app.innerHTML=vManual();
  else if(v==="issues") app.innerHTML=vIssues();
  else if(v==="summary") app.innerHTML=vSummary();
  else if(v==="boxview") app.innerHTML=vBoxView();
  bind();
}
function go(v){ if(v!=="scan") stopCam(); S.view=v;render();window.scrollTo(0,0)}
function cur(){return S.cur?S.boxes.get(S.cur):null}

function vWelcome(){return `
<div class="panel">
  <h1>Pack the NY inventory</h1>
  <p class="muted">Each box: count the garments on the table, scan each one as it goes into the box, check the count, then measure and weigh the box.</p>
  <label>Your full name<input id="f_name" autocomplete="name" value="${esc(S.name)}" placeholder="e.g. Laura Gómez"></label>
  <label>Where are you packing?<select id="f_loc">${["","Dumbo","Tribeca","Nomad","Warehouse / other"].map(o=>`<option ${o===S.location?"selected":""} value="${esc(o)}">${o||"Choose a location"}</option>`).join("")}</select></label>
  <button class="primary block" data-a="start">Start</button>
</div>
<div class="note info"><b>Before you start</b><span>Have ready: boxes, tape, a marker, a tape measure and a scale. A handheld QR scanner (USB or Bluetooth) is the fastest way; you can also take a photo of each QR with your phone.</span></div>`}

function vHome(){
  const boxes=[...S.boxes.values()].sort((a,b)=>a.number-b.number);
  const closed=boxes.filter(b=>b.status==="closed");
  const units=closed.reduce((a,b)=>a+scannedOf(b),0);
  const open=boxes.filter(b=>b.status!=="closed");
  const myOpen=open.filter(b=>b.packer===S.name);
  const issues=[...S.issues.values()];
  return `
${modeNote()}
<div class="stats">
  <div class="stat"><div class="n">${closed.length}</div><div class="l">Boxes closed</div></div>
  <div class="stat"><div class="n">${units}</div><div class="l">Garments packed</div></div>
  <div class="stat"><div class="n">${open.length}</div><div class="l">Boxes open</div></div>
  <div class="stat"><div class="n">${issues.length}</div><div class="l">Issues</div></div>
</div>
${myOpen.length?`<div class="note warn"><b>You have ${myOpen.length===1?"an open box":myOpen.length+" open boxes"}: ${myOpen.map(b=>"Box "+b.number).join(", ")}.</b><span>Finish it before starting another one, so garments don't get mixed.</span><button class="primary" data-a="resume" data-id="${myOpen[0].id}">Continue Box ${myOpen[0].number}</button></div>`:""}
<button class="primary block" data-a="newbox" ${myOpen.length?"disabled":""}>Start a new box</button>
<div class="row"><button class="grow" data-a="go" data-v="issues">Report an issue</button><button class="grow" data-a="go" data-v="summary">My summary</button></div>
<div class="panel"><div class="row"><h2 class="grow">All boxes</h2><span class="small muted">${S.mode==="sync"?"Everyone's boxes, live":"This device"}</span></div>
  ${boxes.length?`<div class="list">${boxes.map(b=>`<button class="boxrow" data-a="openbox" data-id="${b.id}"><span class="boxno">#${b.number}</span><span class="grow"><b>${scannedOf(b)} garments</b><br><span class="small muted">${esc(b.packer)}${b.location?" · "+esc(b.location):""} · ${fmtT(b.closedAt||b.createdAt)}</span></span><span class="chip ${b.status==="closed"?"closed":"open"}">${b.status==="closed"?"Closed":"Open"}</span></button>`).join("")}</div>`:`<p class="muted">No boxes yet. Tap “Start a new box” to begin with Box 1.</p>`}
</div>
<div class="panel"><h2>Download for Colombia</h2><p class="small muted">Packing list per box, box sizes and weights, totals per SKU and all issues, in one Excel file.</p><button data-a="xlsx_all">Download full packing list (Excel)</button></div>
<button class="ghost" data-a="changeuser">Not ${esc(S.name)}? Change name</button>`}

function vCount(){const b=cur();return `
${stepper(0)}
<div class="panel">
  <h1>Box ${b.number}: count first</h1>
  <p>Put the garments for this box on the table and count them by hand. Only put on the table what fits in one box.</p>
  <label>How many garments are on the table?<input id="f_decl" type="number" inputmode="numeric" min="1" step="1" value="${b.declared||""}" placeholder="e.g. 40"></label>
  <div id="declwarn"></div>
  <button class="primary block" data-a="setdecl">Start scanning</button>
</div>
<div class="note info"><b>Tip</b><span>Group similar garments in the same box (bras with bras, leggings with leggings). Keep piles at ${MAX_PILE} or fewer so the count stays accurate.</span></div>
<button class="ghost" data-a="cancelbox">Cancel this box</button>`}

function vScan(){const b=cur();return `
${stepper(1)}
<div class="panel">
  <div class="row"><h1 class="grow">Box ${b.number}</h1><span class="small muted">Counted on table: <b>${b.declared}</b> <button class="ghost small" data-a="editdecl">change</button></span></div>
  <div id="counter"></div>
  <div id="scanmsg"></div>
  <div id="camwrap" class="cam" hidden><video id="cam" playsinline muted></video><div class="frame"></div><div class="hint" id="camhint">Hold one QR inside the frame</div></div>
  <button class="primary block" data-a="cam" id="cambtn">${CAM.on?"Stop camera":"Scan with camera"}</button>
  <label>Or use a handheld scanner<input id="scan" class="scanin" autocomplete="off" autocapitalize="characters" spellcheck="false" ${S.kbd?"":'inputmode="none"'} placeholder="Point the scanner at the QR"></label>
  <div class="row">
    <button class="grow" data-a="photo" type="button">Take a photo of the QR</button>
    <button class="grow" data-a="go" data-v="manual">No tag? Add by hand</button>
  </div>
  <input id="photoin" type="file" accept="image/*" capture="environment" hidden>
  <div class="row small"><button class="ghost" data-a="kbd">${S.kbd?"Hide keyboard":"Type a code by hand"}</button><button class="ghost" data-a="undo" ${S.undo.length?"":"disabled"}>Undo last scan</button></div>
  <p class="small muted">Rule: scan a garment, then put it in the box right away. Unscanned garments stay on the table. With the camera, move each garment out of the frame before showing the next one.</p>
</div>
<div class="panel"><div class="row"><h2 class="grow">In this box</h2><span class="small muted">Tap − to remove one</span></div><div id="items" class="list"></div></div>
<button class="primary block" data-a="toclose">Close box</button>
<div id="restartzone"><button class="danger block" data-a="restartask">Restart this box</button></div>
<button class="ghost" data-a="go" data-v="home">Back to all boxes (box stays open)</button>`}

function renderScanParts(){
  const b=cur(); if(!b||!$("#counter")) return;
  const n=scannedOf(b), d=b.declared||0, left=d-n;
  const pct=d?Math.min(100,n/d*100):0;
  $("#counter").innerHTML=`<div class="counter"><div><div class="n">${d}</div><div class="l">Counted</div></div><div><div class="n">${n}</div><div class="l">Scanned</div></div><div><div class="n" style="color:${left<0?"var(--bad)":left===0?"var(--ok)":"inherit"}">${left<0?"+"+(-left):left}</div><div class="l">${left<0?"Over count":"On table"}</div></div></div><div class="bar ${left<0?"over":left===0?"full":""}"><i style="width:${pct}%"></i></div>`;
  $("#scanmsg").innerHTML= left===0&&n>0?`<div class="note ok"><b>Count reached.</b><span>The table should now be empty. If it is, tap “Close box”.</span></div>`
    : left<0?`<div class="note bad"><b>You scanned ${-left} more than you counted.</b><span>A garment may have been scanned twice. Check the list and tap − on the repeated one, or change the counted number if your count was wrong.</span></div>`:"";
  const items=Object.entries(b.items||{}).sort((x,y)=>(y[1].t||0)-(x[1].t||0));
  $("#items").innerHTML=items.length?items.map(([k,i])=>`<div class="item ${S.lastKey===k?"flash":""}"><div class="t"><b>${esc(i.name)}</b> · ${esc(i.color)} · ${esc(i.size)} ${i.manual?'<span class="chip man">By hand</span>':""} ${i.unknown?'<span class="chip unk">Not in guide</span>':""}<div class="sku">${esc(i.sku)}</div></div><span class="qty">${i.qty}</span><button data-a="minus" data-k="${esc(k)}" aria-label="Remove one">−</button></div>`).join(""):`<p class="muted">Nothing scanned yet.</p>`;
  bindDyn();
}

function vClose(){const b=cur();const n=scannedOf(b),d=b.declared,left=d-n;
  let body="";
  if(n===0) body=`<div class="note bad"><b>This box is empty.</b><span>Scan at least one garment, or cancel the box.</span></div><button class="block" data-a="backscan">Back to scanning</button><button class="ghost" data-a="cancelbox">Cancel this box</button>`;
  else if(left===0) body=`<div class="note ok"><b>Correct: you counted ${d} and scanned ${n}.</b><span>Make sure the table is empty, then seal the box.</span></div><button class="primary block" data-a="todims">Continue to size and weight</button><button class="ghost" data-a="backscan">Back to scanning</button>`;
  else if(left>0) body=`<div class="note warn"><b>You scanned ${n}. You counted ${d}, so ${left} should still be on the table.</b><span>Count what is left on the table. Is it ${left}?</span></div>
    <button class="primary block" data-a="closepartial">Yes, ${left} are on the table. Close box with ${n}</button>
    <p class="small muted">The ${left} left on the table go into the next box. You will count them again there.</p>
    <button class="block" data-a="backscan">No, keep scanning</button>
    <button class="danger block" data-a="restartask2">No, the numbers don't match. Restart this box</button>`;
  else body=`<div class="note bad"><b>You scanned ${n} but counted ${d}: ${-left} extra.</b><span>Something was scanned twice, or the first count was wrong. Remove the repeated scans, or recount everything inside the box.</span></div>
    <button class="block" data-a="backscan">Review the list</button>
    <label>I recounted the box and there are:<input id="f_recount" type="number" inputmode="numeric" min="1" placeholder="${n}"></label>
    <button class="primary block" data-a="recount">Confirm recount</button>
    <button class="danger block" data-a="restartask2">Restart this box</button>`;
  return `${stepper(2)}<div class="panel"><h1>Close Box ${b.number}</h1>${body}</div><div id="restartzone"></div>`}

function vDims(){const b=cur();const u=S.unit;const L=u==="in"?["in","lb"]:["cm","kg"];const dm=b.dims||{},w=b.weight||{};
  return `${stepper(3)}<div class="panel"><h1>Box ${b.number}: size and weight</h1>
  <p>Seal the box and write <b>BOX ${b.number}</b> on two sides with the marker. Then measure the outside of the box and weigh it.</p>
  <div class="row"><span class="small muted grow">Units</span><div class="seg"><button class="${u==="in"?"on":""}" data-a="unit" data-u="in">in / lb</button><button class="${u==="cm"?"on":""}" data-a="unit" data-u="cm">cm / kg</button></div></div>
  <div class="dims"><label>Length (${L[0]})<input id="f_l" type="number" inputmode="decimal" step="0.1" value="${dm.unit===u?dm.l??"":""}"></label><label>Width (${L[0]})<input id="f_w" type="number" inputmode="decimal" step="0.1" value="${dm.unit===u?dm.w??"":""}"></label><label>Height (${L[0]})<input id="f_h" type="number" inputmode="decimal" step="0.1" value="${dm.unit===u?dm.h??"":""}"></label></div>
  <label>Weight (${L[1]})<input id="f_kg" type="number" inputmode="decimal" step="0.1" value="${w.unit===(u==="in"?"lb":"kg")?w.v??"":""}"></label>
  <div id="dimwarn"></div>
  <button class="primary block" data-a="savedims">Close box</button>
  <button class="ghost" data-a="backscan">Back to scanning</button></div>`}

function vBoxDone(){const b=cur();return `<div class="panel" style="text-align:center"><p class="muted">Closed</p><div class="bigbox">BOX ${b.number}</div><p><b>${scannedOf(b)} garments</b> · ${dimTxt(b)} · ${wTxt(b)}</p><p class="small muted">Write “BOX ${b.number}” on the box if you haven't yet.</p></div>
${b.leftover?`<div class="note warn"><b>${b.leftover} garments are still on the table.</b><span>Start the next box with them.</span><button class="primary" data-a="newbox" data-decl="${b.leftover}">Start next box with these ${b.leftover}</button></div>`:""}
<button class="${b.leftover?"":"primary "}block" data-a="newbox">Start a new box</button>
<button class="block" data-a="go" data-v="summary">I'm done: show my summary</button>
<button class="ghost" data-a="go" data-v="home">All boxes</button>`}

function vManual(){const st=Object.entries(STYLES).filter((e,i,a)=>a.findIndex(x=>x[1]===e[1])===i).sort((a,b)=>a[1].localeCompare(b[1]));
  return `<div class="panel"><h1>Add a garment by hand</h1><p class="muted">Use this only when the garment has no tag or the QR can't be read. It will also be reported as an issue to Colombia.</p>
  <label>Type of garment<select id="m_style"><option value="">Choose…</option>${st.map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}<option value="OTHER">Not in the list</option></select></label>
  <label id="m_otherw" hidden>Describe the garment<input id="m_other" placeholder="e.g. green zip hoodie"></label>
  <label>Color<select id="m_color"><option value="">Choose…</option>${Object.entries(COLORS).sort((a,b)=>a[1].localeCompare(b[1])).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}<option value="OTHER">Other</option></select></label>
  <label id="m_ocw" hidden>Color name<input id="m_ocolor" placeholder="e.g. Sage"></label>
  <label>Size<select id="m_size"><option value="">Choose…</option>${Object.keys(SIZE_CODE).map(s=>`<option>${s}</option>`).join("")}</select></label>
  <label>Why by hand?<select id="m_why"><option>No tag</option><option>Tag without QR</option><option>QR won't scan</option><option>Tag is damaged</option></select></label>
  <div id="mwarn"></div>
  <button class="primary block" data-a="addmanual">Add 1 to Box ${cur()?.number}</button>
  <button class="ghost" data-a="backscan">Cancel</button></div>`}

const ISSUE_TYPES=["Damaged garment","Stained or dirty","No tag / no QR","QR won't scan","Not in our catalog","Count difference","Missing items","Other"];
function vIssues(){const d=S.issueDraft||{};const list=[...S.issues.values()].sort((a,b)=>b.createdAt-a.createdAt);
  const myBoxes=[...S.boxes.values()].sort((a,b)=>a.number-b.number);
  return `<div class="panel"><h1>Report an issue</h1>
  <p class="muted">${S.mode==="sync"?"Issues go straight to the Colombia team. If you are offline, they are sent when the connection comes back.":"Issues are saved on this device. Send the Excel to Colombia when you finish."}</p>
  <label>What happened?<select id="i_type">${ISSUE_TYPES.map(t=>`<option ${t===d.type?"selected":""}>${t}</option>`).join("")}</select></label>
  <label>Garment (scan, or describe)<input id="i_item" value="${esc(d.item||"")}" placeholder="Scan the QR or write e.g. Strappy Bra Merlot M"></label>
  <div class="row"><label class="grow">Quantity<input id="i_qty" type="number" inputmode="numeric" min="1" value="${d.qty||1}"></label>
  <label class="grow">Box<select id="i_box"><option value="">Not packed / none</option>${myBoxes.map(b=>`<option value="${b.number}" ${String(b.number)===String(d.box)?"selected":""}>Box ${b.number}</option>`).join("")}</select></label></div>
  <label>Details<textarea id="i_notes" placeholder="What do you see? e.g. seam open on left strap">${esc(d.notes||"")}</textarea></label>
  <div id="iwarn"></div>
  <button class="primary block" data-a="saveissue">Send issue</button>
  <button class="ghost" data-a="go" data-v="${S.cur&&cur()&&cur().status!=="closed"?"scan":"home"}">Back</button></div>
  <div class="panel"><h2>Reported issues (${list.length})</h2>${list.length?`<div class="list">${list.map(i=>`<div class="item"><div class="t"><b>${esc(i.type)}</b> · ${i.qty}× ${esc(i.item||"—")}${i.box?` · Box ${i.box}`:""}<div class="small muted">${esc(i.notes)}</div><div class="sku">${esc(i.reporter)} · ${fmtT(i.createdAt)}${i.auto?" · added automatically":""}</div></div></div>`).join("")}</div>`:`<p class="muted">No issues reported.</p>`}</div>`}

function vSummary(){const mine=[...S.boxes.values()].filter(b=>b.packer===S.name).sort((a,b)=>a.number-b.number);
  const closed=mine.filter(b=>b.status==="closed"), open=mine.filter(b=>b.status!=="closed");
  const tot=closed.reduce((a,b)=>a+scannedOf(b),0); const iss=[...S.issues.values()].filter(i=>i.reporter===S.name);
  const man=closed.reduce((a,b)=>a+Object.values(b.items).filter(i=>i.manual).reduce((x,i)=>x+i.qty,0),0);
  return `<div class="panel"><h1>Summary for ${esc(S.name)}</h1><p class="muted">${fmtT(now())}</p>
  <div class="stats"><div class="stat"><div class="n">${closed.length}</div><div class="l">Boxes closed</div></div><div class="stat"><div class="n">${tot}</div><div class="l">Garments</div></div><div class="stat"><div class="n">${man}</div><div class="l">Added by hand</div></div><div class="stat"><div class="n">${iss.length}</div><div class="l">Issues</div></div></div>
  ${open.length?`<div class="note warn"><b>You still have ${open.length} open box${open.length>1?"es":""}: ${open.map(b=>"Box "+b.number).join(", ")}.</b><span>Close or cancel ${open.length>1?"them":"it"} before you leave.</span><button data-a="resume" data-id="${open[0].id}">Go to Box ${open[0].number}</button></div>`:""}
  </div>
  <div class="panel"><h2>Boxes you packed</h2>${closed.length?`<div class="tablewrap"><table><thead><tr><th>Box</th><th class="num">Garments</th><th>Size</th><th>Weight</th></tr></thead><tbody>${closed.map(b=>`<tr><td><button class="ghost" data-a="openbox" data-id="${b.id}">Box ${b.number}</button></td><td class="num">${scannedOf(b)}</td><td>${dimTxt(b)}</td><td>${wTxt(b)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="num"><b>${tot}</b></td><td></td><td>${totW(closed)}</td></tr></tbody></table></div>`:`<p class="muted">No closed boxes yet.</p>`}</div>
  ${modeNote()}
  <button class="primary block" data-a="xlsx_me">Download my summary (Excel)</button>
  <button class="ghost" data-a="go" data-v="home">All boxes</button>`}

function vBoxView(){const b=S.boxes.get(S.viewBox);if(!b)return `<p>Box not found.</p>`;const items=Object.values(b.items||{}).sort((x,y)=>x.name.localeCompare(y.name)||x.color.localeCompare(y.color));
  return `<div class="panel"><div class="row"><h1 class="grow">Box ${b.number}</h1><span class="chip ${b.status==="closed"?"closed":"open"}">${b.status==="closed"?"Closed":"Open"}</span></div>
  <p class="muted">${esc(b.packer)}${b.location?" · "+esc(b.location):""} · ${fmtT(b.closedAt||b.createdAt)}</p>
  <p><b>${scannedOf(b)} garments</b>${b.status==="closed"?` · ${dimTxt(b)} · ${wTxt(b)}`:""}${b.restarts?` · restarted ${b.restarts}×`:""}</p>
  <div class="tablewrap"><table><thead><tr><th>Garment</th><th>Color</th><th>Size</th><th class="num">Qty</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.name)}${i.manual?' <span class="chip man">By hand</span>':""}<div class="sku">${esc(i.sku)}</div></td><td>${esc(i.color)}</td><td>${esc(i.size)}</td><td class="num">${i.qty}</td></tr>`).join("")}</tbody></table></div>
  ${b.status!=="closed"&&b.packer===S.name?`<button class="primary" data-a="resume" data-id="${b.id}">Continue this box</button>`:""}
  ${b.status!=="closed"&&b.packer!==S.name?`<div class="note info"><span>${esc(b.packer)} is packing this box. You can take it over only if they stopped.</span><button data-a="takeover" data-id="${b.id}">Take over this box</button></div>`:""}
  ${b.status==="closed"?`<div id="reopenzone"><button class="danger" data-a="reopenask">Reopen this box</button></div>`:""}
  </div><button class="ghost" data-a="back">Back</button>`}

function dimTxt(b){const d=b.dims;return d&&d.l?`${d.l}×${d.w}×${d.h} ${d.unit}`:"no size"}
function wTxt(b){const w=b.weight;return w&&w.v?`${w.v} ${w.unit}`:"no weight"}
function toKg(w){return w&&w.v?(w.unit==="lb"?w.v*0.453592:w.v):0}
function totW(bs){const kg=bs.reduce((a,b)=>a+toKg(b.weight),0);return kg?`${(kg/0.453592).toFixed(1)} lb · ${kg.toFixed(1)} kg`:""}

/* ---------- Actions ---------- */
let backTo="home";
function bind(){
  document.querySelectorAll("#app [data-a]").forEach(el=>{ if(el.dataset.bound) return; el.dataset.bound=1; el.addEventListener("click",e=>{e.preventDefault();act(el.dataset.a,el)}); });
  const sc=$("#scan"); if(sc&&!sc.dataset.bound){ sc.dataset.bound=1; sc.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); const v=sc.value; sc.value=""; if(v.trim()) onScan(v); } }); }
  const ph=$("#photoin"); if(ph&&!ph.dataset.bound){ ph.dataset.bound=1; ph.addEventListener("change",onPhoto); }
  const dc=$("#f_decl"); if(dc) dc.addEventListener("input",()=>{const n=+dc.value;$("#declwarn").innerHTML=n>MAX_PILE?`<div class="note warn"><b>${n} is a big pile.</b><span>Counts over ${MAX_PILE} are easy to get wrong and may not fit one box. Consider splitting into two boxes.</span></div>`:""});
  const ms=$("#m_style"); if(ms){ ms.addEventListener("change",()=>$("#m_otherw").hidden=ms.value!=="OTHER"); $("#m_color").addEventListener("change",()=>$("#m_ocw").hidden=$("#m_color").value!=="OTHER"); }
  const ii=$("#i_item"); if(ii) ii.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const p=parseCode(ii.value); if(p) ii.value=`${p.name||"Unknown item"} ${p.colorName} ${p.sizeName} (${p.sku})`; } });
}
function bindDyn(){ document.querySelectorAll("#items [data-a]").forEach(el=>{ if(el.dataset.bound) return; el.dataset.bound=1; el.addEventListener("click",e=>{e.preventDefault();act(el.dataset.a,el)}); }); }
function focusScan(){ if(CAM.on) return; const sc=$("#scan"); if(sc) setTimeout(()=>sc.focus({preventScroll:true}),30); }

async function act(a,el){
  const b=cur();
  switch(a){
  case "start":{ const n=$("#f_name").value.trim(), l=$("#f_loc").value; if(n.length<3){toast("Write your full name","bad");return} if(!l){toast("Choose where you are packing","bad");return} S.name=n;S.location=l;ls.set("nyp_name",n);ls.set("nyp_loc",l);go("home");break}
  case "changeuser": go("welcome");break;
  case "go": go(el.dataset.v);break;
  case "back": go(backTo);break;
  case "openbox": backTo=S.view; S.viewBox=el.dataset.id; go("boxview");break;
  case "resume": S.cur=el.dataset.id; S.undo=[]; const rb=cur(); go(rb.declared?"scan":"count"); break;
  case "takeover":{ const tb=S.boxes.get(el.dataset.id); tb.notes=(tb.notes||[]).concat(`Taken over by ${S.name} from ${tb.packer} ${fmtT(now())}`); tb.packer=S.name; saveBox(tb); S.cur=tb.id; S.undo=[]; go(tb.declared?"scan":"count"); break}
  case "newbox":{
    const mine=[...S.boxes.values()].find(x=>x.status!=="closed"&&x.packer===S.name); if(mine){toast(`Finish Box ${mine.number} first`,"warn");return}
    el.disabled=true; const num=await nextBoxNumber();
    const nb={_local:true,id:"box-"+num+"-"+Math.random().toString(36).slice(2,7),number:num,packer:S.name,location:S.location,status:"open",declared:el.dataset.decl?+el.dataset.decl:null,items:{},restarts:0,createdAt:now(),notes:[]};
    if(el.dataset.decl) nb.notes.push(`Started with ${el.dataset.decl} left over from previous box`);
    saveBox(nb); S.cur=nb.id; S.undo=[]; go("count"); break}
  case "cancelbox":{ if(scannedOf(b)>0){toast("Remove the scanned garments first, or restart the box","warn");return} S.boxes.delete(b.id); try{await store.deleteBox(b.id)}catch(e){} S.cur=null; toast(`Box ${b.number} cancelled`,"warn"); go("home"); break}
  case "setdecl":{ const n=Math.floor(+$("#f_decl").value); if(!n||n<1){toast("Write how many garments you counted","bad");return} b.declared=n; b.status="open"; saveBox(b); go("scan"); break}
  case "editdecl":{ S.view="count"; render(); break}
  case "kbd": S.kbd=!S.kbd; render(); break;
  case "photo": $("#photoin").click(); break;
  case "cam": if(CAM.on) stopCam(); else startCam(); break;
  case "undo":{ const k=S.undo.pop(); if(k&&b.items[k]){ b.items[k].qty--; if(b.items[k].qty<=0) delete b.items[k]; saveBox(b); toast("Last scan removed","warn"); } renderScanParts(); $("[data-a=undo]").disabled=!S.undo.length; focusScan(); break}
  case "minus":{ const k=el.dataset.k; if(b.items[k]){ b.items[k].qty--; if(b.items[k].qty<=0) delete b.items[k]; b.notes=(b.notes||[]); saveBox(b); toast("Removed one. Take that garment out of the box and put it back on the table","warn",3200);} renderScanParts(); focusScan(); break}
  case "restartask": case "restartask2":{ const z=$("#restartzone"); z.innerHTML=`<div class="note bad"><b>Restart Box ${b.number}?</b><span>This deletes the ${scannedOf(b)} garments scanned in this box only. Other boxes are not affected. Take everything out of the box, put it back on the table and count again.</span><div class="row"><button class="danger grow" data-a="restartyes">Yes, restart Box ${b.number}</button><button class="grow" data-a="restartno">Cancel</button></div></div>`; bind(); z.scrollIntoView({block:"center"}); break}
  case "restartno": render(); break;
  case "restartyes":{ b.items={}; b.declared=null; b.restarts=(b.restarts||0)+1; b.leftover=null; b.status="open"; b.notes=(b.notes||[]).concat(`Restarted by ${S.name} ${fmtT(now())}`); saveBox(b); S.undo=[]; toast(`Box ${b.number} restarted. Count the table again`,"warn",3000); go("count"); break}
  case "toclose": go("close"); break;
  case "backscan": go("scan"); break;
  case "todims": go("dims"); break;
  case "closepartial":{ const n=scannedOf(b), left=b.declared-n; b.notes=(b.notes||[]).concat(`Counted ${b.declared}, scanned ${n}; ${left} left on table for next box`); b.leftover=left; b.declared=n; saveBox(b); go("dims"); break}
  case "recount":{ const r=Math.floor(+$("#f_recount").value), n=scannedOf(b); if(!r){toast("Write the recount","bad");return} if(r!==n){ toast(`Recount is ${r} but ${n} are scanned. Fix the list or restart the box`,"bad",4000); return } b.notes=(b.notes||[]).concat(`Count changed from ${b.declared} to ${r} after recount`); b.declared=r; saveBox(b); go("dims"); break}
  case "unit": S.unit=el.dataset.u; ls.set("nyp_unit",S.unit); render(); break;
  case "savedims":{ const l=+$("#f_l").value,w=+$("#f_w").value,h=+$("#f_h").value,kg=+$("#f_kg").value; const u=S.unit;
    if(!(l>0&&w>0&&h>0)){toast("Write length, width and height","bad");return} if(!(kg>0)){toast("Write the weight","bad");return}
    const lim=u==="in"?{min:4,max:48,wmax:70,wu:"lb",du:"in"}:{min:10,max:122,wmax:32,wu:"kg",du:"cm"};
    const warns=[]; [l,w,h].forEach(x=>{ if(x<lim.min||x>lim.max) warns.push(`A side of ${x} ${lim.du} looks unusual for a box. Check the unit.`) });
    if(kg>lim.wmax) warns.push(`${kg} ${lim.wu} is heavy. Most carriers charge extra or refuse boxes over ${lim.wmax} ${lim.wu}. Consider splitting.`);
    const per=(u==="in"?kg*0.453592:kg)/Math.max(1,scannedOf(b)); if(per>1.2) warns.push(`That is over ${(per).toFixed(1)} kg per garment. Check the weight and unit.`);
    if(warns.length&&!el.dataset.ok){ $("#dimwarn").innerHTML=`<div class="note warn">${warns.map(x=>`<span>${x}</span>`).join("")}<span>Tap “Close box” again if the numbers are right.</span></div>`; el.dataset.ok=1; return }
    b.dims={l,w,h,unit:u==="in"?"in":"cm"}; b.weight={v:kg,unit:u==="in"?"lb":"kg"}; b.status="closed"; b.closedAt=now(); b.closedBy=S.name; saveBox(b); beep(true); go("boxdone"); break}
  case "addmanual":{ const st=$("#m_style").value,co=$("#m_color").value,sz=$("#m_size").value,why=$("#m_why").value;
    if(!st||!co||!sz){toast("Choose type, color and size","bad");return}
    let name=st==="OTHER"?$("#m_other").value.trim():STYLES[st]; let cname=co==="OTHER"?$("#m_ocolor").value.trim():COLORS[co];
    if(!name||!cname){toast("Describe the garment and its color","bad");return}
    const sku=(st!=="OTHER"&&co!=="OTHER")?st+co+SIZE_CODE[sz]:"MANUAL";
    const key="M:"+(sku==="MANUAL"?[name,cname,sz].join("|").toUpperCase():sku);
    addItem(b,key,{sku,name,color:cname,size:sz,manual:true});
    const iss={id:"iss-"+now()+"-"+Math.random().toString(36).slice(2,6),type:why==="QR won't scan"?"QR won't scan":"No tag / no QR",item:`${name} ${cname} ${sz}${sku!=="MANUAL"?" ("+sku+")":""}`,qty:1,box:b.number,notes:`Added by hand: ${why}`,reporter:S.name,location:S.location,createdAt:now(),auto:true};
    S.issues.set(iss.id,iss); store.saveIssue(iss).catch(()=>setSync("err","Issue not sent — check internet"));
    toast(`Added: ${name} ${cname} ${sz}`); go("scan"); break}
  case "saveissue":{ const d={type:$("#i_type").value,item:$("#i_item").value.trim(),qty:Math.max(1,Math.floor(+$("#i_qty").value||1)),box:$("#i_box").value,notes:$("#i_notes").value.trim()};
    if(d.notes.length<5){ S.issueDraft=d; $("#iwarn").innerHTML=`<div class="note bad"><span>Write a few words in “Details” so Colombia understands the issue.</span></div>`; return }
    const iss={id:"iss-"+now()+"-"+Math.random().toString(36).slice(2,6),...d,box:d.box?+d.box:null,reporter:S.name,location:S.location,createdAt:now()};
    S.issues.set(iss.id,iss); S.issueDraft=null;
    try{ await store.saveIssue(iss); toast(S.mode==="sync"?"Issue sent to Colombia":"Issue saved on this device"); }catch(e){ setSync("err","Issue not sent — check internet"); toast("Not sent. Check internet and try again","bad"); }
    render(); break}
  case "reopenask":{ $("#reopenzone").innerHTML=`<div class="note bad"><b>Reopen Box ${S.boxes.get(S.viewBox).number}?</b><span>Only do this if you need to add or remove garments. You will have to count, check and weigh it again.</span><div class="row"><button class="danger grow" data-a="reopenyes">Yes, reopen</button><button class="grow" data-a="back">Cancel</button></div></div>`; bind(); break}
  case "reopenyes":{ const ob=S.boxes.get(S.viewBox); const mine=[...S.boxes.values()].find(x=>x.status!=="closed"&&x.packer===S.name); if(mine){toast(`Finish Box ${mine.number} first`,"warn");return} ob.status="open"; ob.notes=(ob.notes||[]).concat(`Reopened by ${S.name} ${fmtT(now())}`); ob.packer=S.name; ob.closedAt=null; saveBox(ob); S.cur=ob.id; S.undo=[]; go("scan"); break}
  case "xlsx_all": exportXlsx(null); break;
  case "xlsx_me": exportXlsx(S.name); break;
  }
}

function addItem(b,key,info){
  b.items=b.items||{}; const it=b.items[key]||(b.items[key]={...info,qty:0}); it.qty++; it.t=now();
  S.undo.push(key); S.lastKey=key; saveBox(b);
}
function onScan(raw){
  const b=cur(); if(!b) return;
  const code=String(raw).trim(); const t=now();
  if(code===S.lastScan.code && t-S.lastScan.t<700){ return; }
  S.lastScan={code,t};
  const p=parseCode(code);
  if(!p){ beep(false); toast("This is not a garment code. Scan the garment's QR, or add it by hand","bad",3500); return; }
  const unknown=!p.name;
  addItem(b,p.sku,{sku:p.sku,name:p.name||"Unknown item",color:p.colorName,size:p.sizeName,manual:false,unknown});
  const left=b.declared-scannedOf(b);
  if(left<0){ beep(false); toast(`Over your count by ${-left}. Check for a repeated scan`,"bad",3000); }
  else if(unknown){ beep(false); toast(`Added, but ${p.sku} is not in the guide. Report it if it looks wrong`,"warn",3500); }
  else { beep(true); toast(`${p.name} · ${p.colorName} · ${p.sizeName}${left===0?"  —  count reached":""}`,"ok",1600); }
  renderScanParts(); const u=$("[data-a=undo]"); if(u) u.disabled=false; focusScan();
}
async function onPhoto(e){
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  if(typeof jsQR!=="function"){ toast("The QR reader didn't load. Use a scanner or add by hand","bad",3500); return; }
  toast("Reading QR…","warn",1200);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
    let found=null;
    for(const max of [1400,900,2000]){
      const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(img,0,0,c.width,c.height); const d=x.getImageData(0,0,c.width,c.height);
      const r=jsQR(d.data,c.width,c.height,{inversionAttempts:"attemptBoth"}); if(r&&r.data){found=r.data;break}
    }
    URL.revokeObjectURL(img.src);
    if(!found){ beep(false); toast("Couldn't read the QR. Take the photo closer, in good light, or add it by hand","bad",4000); return; }
    S.lastScan={code:"",t:0}; onScan(found);
  }catch(err){ toast("Couldn't open the photo. Try again","bad"); }
}


/* ---------- Live camera scanning ---------- */
const CAM={on:false,stream:null,raf:0,lastCode:"",lastSeen:0,armed:true,lastAccept:0,canvas:null,wake:null};
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast("This browser can't open the camera. Use Safari or Chrome, or take a photo","bad",4000); return; }
  if(typeof jsQR!=="function"){ toast("The QR reader didn't load. Reload the page","bad"); return; }
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    const m=e&&e.name==="NotAllowedError"?"Camera blocked. Allow camera access for this site in the browser settings, then try again":"Couldn't open the camera. Close other apps using it and try again";
    toast(m,"bad",5000); return;
  }
  CAM.on=true; CAM.armed=true; CAM.lastCode=""; 
  try{ CAM.wake=await navigator.wakeLock.request("screen"); }catch(e){}
  attachCam(); const b=$("#cambtn"); if(b) b.textContent="Stop camera";
}
function attachCam(){
  const v=$("#cam"), w=$("#camwrap"); if(!v||!CAM.stream) return;
  w.hidden=false; v.srcObject=CAM.stream; v.play().catch(()=>{});
  cancelAnimationFrame(CAM.raf); let lastT=0;
  const loop=t=>{ CAM.raf=requestAnimationFrame(loop); if(t-lastT<110) return; lastT=t; tick(v); };
  CAM.raf=requestAnimationFrame(loop);
}
function stopCam(){
  cancelAnimationFrame(CAM.raf); if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); } CAM.stream=null; CAM.on=false;
  try{ CAM.wake&&CAM.wake.release(); }catch(e){} CAM.wake=null;
  const w=$("#camwrap"); if(w) w.hidden=true; const b=$("#cambtn"); if(b) b.textContent="Scan with camera";
}
function tick(v){
  if(!v.videoWidth) return;
  const W=640, sc=W/v.videoWidth, H=Math.round(v.videoHeight*sc);
  const c=CAM.canvas||(CAM.canvas=document.createElement("canvas")); c.width=W; c.height=H;
  const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(v,0,0,W,H);
  const r=jsQR(x.getImageData(0,0,W,H).data,W,H,{inversionAttempts:"dontInvert"});
  const t=now(); const hint=$("#camhint");
  if(r&&r.data){
    CAM.lastSeen=t;
    const same=r.data===CAM.lastCode;
    if(CAM.armed && t-CAM.lastAccept>800){
      CAM.armed=false; CAM.lastCode=r.data; CAM.lastAccept=t;
      const w=$("#camwrap"); if(w){ w.classList.add("hit"); setTimeout(()=>w.classList.remove("hit"),350); }
      S.lastScan={code:"",t:0}; onScan(r.data);
      if(hint) hint.textContent="Got it. Move it away, then show the next one";
    } else if(!same && t-CAM.lastAccept>800){ CAM.armed=true; }
  } else if(!CAM.armed && t-CAM.lastSeen>600){
    CAM.armed=true; if(hint) hint.textContent="Hold one QR inside the frame";
  }
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&CAM.on){ stopCam(); } });

/* ---------- Excel export ---------- */
async function exportXlsx(person){
  if(typeof XLSX==="undefined"){ toast("Excel tool didn't load. Reload the page","bad"); return; }
  const boxes=[...S.boxes.values()].filter(b=>!person||b.packer===person).sort((a,b)=>a.number-b.number);
  const issues=[...S.issues.values()].filter(i=>!person||i.reporter===person).sort((a,b)=>a.createdAt-b.createdAt);
  const cm=(v,u)=>v?(u==="in"?+(v*2.54).toFixed(1):+v):""; const inch=(v,u)=>v?(u==="cm"?+(v/2.54).toFixed(1):+v):"";
  const kg=w=>w&&w.v?+toKg(w).toFixed(2):""; const lb=w=>w&&w.v?+(toKg(w)/0.453592).toFixed(2):"";
  const pl=[["Box","Status","Packed by","Location","SKU","Garment","Color","Size","Qty","Added by hand","Not in guide"]];
  boxes.forEach(b=>Object.values(b.items||{}).sort((x,y)=>x.name.localeCompare(y.name)||x.color.localeCompare(y.color)||x.size.localeCompare(y.size)).forEach(i=>pl.push([b.number,b.status,b.packer,b.location||"",i.sku,i.name,i.color,i.size,i.qty,i.manual?"Yes":"",i.unknown?"Yes":""])));
  const bx=[["Box","Status","Packed by","Location","Counted","Scanned","Difference","Length (cm)","Width (cm)","Height (cm)","Weight (kg)","Length (in)","Width (in)","Height (in)","Weight (lb)","Restarts","Started","Closed","Notes"]];
  boxes.forEach(b=>{const d=b.dims||{};const n=scannedOf(b);bx.push([b.number,b.status,b.packer,b.location||"",b.declared||"",n,(b.declared||0)-n,cm(d.l,d.unit),cm(d.w,d.unit),cm(d.h,d.unit),kg(b.weight),inch(d.l,d.unit),inch(d.w,d.unit),inch(d.h,d.unit),lb(b.weight),b.restarts||0,fmtT(b.createdAt),fmtT(b.closedAt),(b.notes||[]).join(" | ")])});
  const agg={}; boxes.forEach(b=>Object.values(b.items||{}).forEach(i=>{const k=i.sku+"|"+i.name+"|"+i.color+"|"+i.size;const a=agg[k]||(agg[k]={sku:i.sku,name:i.name,color:i.color,size:i.size,qty:0,boxes:new Set()});a.qty+=i.qty;a.boxes.add(b.number)}));
  const bs=[["SKU","Garment","Color","Size","Total qty","In boxes"]]; Object.values(agg).sort((x,y)=>x.name.localeCompare(y.name)||x.color.localeCompare(y.color)).forEach(a=>bs.push([a.sku,a.name,a.color,a.size,a.qty,[...a.boxes].sort((x,y)=>x-y).join(", ")]));
  const is=[["Date","Reported by","Location","Type","Garment","Qty","Box","Details","Automatic"]]; issues.forEach(i=>is.push([fmtT(i.createdAt),i.reporter,i.location||"",i.type,i.item||"",i.qty,i.box||"",i.notes,i.auto?"Yes":""]));
  const closed=boxes.filter(b=>b.status==="closed");
  const sm=[["NY Pack-Out — "+(person?"summary for "+person:"all boxes")],["Generated",fmtT(now())],["Boxes closed",closed.length],["Boxes still open",boxes.length-closed.length],["Garments in closed boxes",closed.reduce((a,b)=>a+scannedOf(b),0)],["Garments in open boxes",boxes.filter(b=>b.status!=="closed").reduce((a,b)=>a+scannedOf(b),0)],["Total weight (kg)",+closed.reduce((a,b)=>a+toKg(b.weight),0).toFixed(2)],["Issues reported",issues.length]];
  const wb=XLSX.utils.book_new();
  const add=(rows,name,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add(sm,"Summary",[28,24]); add(pl,"Packing list",[6,8,18,12,13,30,14,8,6,10,10]); add(bx,"Boxes",[6,8,18,12,8,8,10,11,11,11,11,11,11,11,11,8,16,16,50]); add(bs,"By SKU",[13,30,14,8,9,20]); add(is,"Issues",[16,18,12,18,30,6,6,50,10]);
  const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const fname=`NY_PackOut_${person?person.replace(/[^A-Za-z0-9]+/g,"_")+"_":""}${new Date().toISOString().slice(0,10)}.xlsx`;
  const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const file=new File([blob],fname,{type:blob.type});
  if(person&&navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:fname,text:"NY Pack-Out summary"}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); toast("Excel downloaded");
}
async function copyFallback(rows){
  const txt=rows.map(r=>r.join("\t")).join("\n");
  try{ await navigator.clipboard.writeText(txt); toast("Downloads aren't available here. The packing list was copied — paste it into Excel or WhatsApp","warn",5000); }
  catch(e){ toast("Downloads aren't available on this view. Open the page in a browser to download","bad",5000); }
}

window.addEventListener("beforeunload",e=>{ if(Object.values(wq).some(q=>q.busy||q.dirty)){ e.preventDefault(); e.returnValue=""; } });
init();
