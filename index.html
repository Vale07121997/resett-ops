body{margin:0}

.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.85);border-radius:12px;transition:border-color .15s}
.cam.hit .frame{border-color:#3ddc84}
.cam .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px #000}

body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.brand{font-weight:700;letter-spacing:.02em;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}

h1{font-size:22px;margin:0;text-wrap:balance} h2{font-size:17px;margin:0} p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

textarea{min-height:80px;resize:vertical}

.block{width:100%}

const store={

  async deleteBox(id){ cacheLocal(); if(!sb) return; const {error}=await sb.from("ny_boxes").delete().eq("id",id); if(error) throw {code:"unavailable",message:error.message}; },
  async saveIssue(i){ cacheLocal(); if(!sb) return; const {error}=await sb.from("ny_issues").upsert({id:i.id,data:i,created_at:new Date(i.createdAt).toISOString()}); if(error) throw {code:"unavailable",message:error.message}; i._synced=true; cacheLocal(); }

function cacheLocal(){ ls.set("nyp_local",{boxes:[...S.boxes.values()],issues:[...S.issues.values()]}); }
function loadLocal(){ const d=ls.get("nyp_local",{boxes:[],issues:[]}); (d.boxes||[]).forEach(b=>S.boxes.set(b.id,b)); (d.issues||[]).forEach(i=>S.issues.set(i.id,i)); }
const wq={};
function saveBox(b){ b.updatedAt=now(); S.boxes.set(b.id,b); const q=wq[b.id]||(wq[b.id]={busy:false,dirty:false}); q.dirty=true; if(!q.busy) flush(b.id); }
async function flush(id){
  const q=wq[id]; q.busy=true; let tries=0;
  while(q.dirty){ q.dirty=false; const b=S.boxes.get(id); if(!b) break;
    try{ await store.saveBox(b); if(sb) b._local=false; setSync(db?"ok":"local"); tries=0; }
    catch(e){ setSync("err","nosave"); q.dirty=true; tries++; await sleep(Math.min(8000,1000*tries)+Math.random()*400); }
  }
  q.busy=false;
}
function pending(id){const q=wq[id];return q&&(q.busy||q.dirty)}

async function pullAll(){
  if(!sb) return;
  const [bx,is]=await Promise.all([sb.from("ny_boxes").select("id,data"),sb.from("ny_issues").select("id,data")]);
  if(bx.error||is.error){ setSync("err","noserver"); return; }
  const seen=new Set();
  bx.data.forEach(r=>{ seen.add(r.id); if(pending(r.id)) return; const loc=S.boxes.get(r.id); if(loc&&(loc.updatedAt||0)>(r.data.updatedAt||0)){ saveBox(loc); return; } S.boxes.set(r.id,r.data); });
  [...S.boxes.keys()].forEach(id=>{ if(!seen.has(id)&&!pending(id)){ const b=S.boxes.get(id); if(b.packer===S.name&&b._local) saveBox(b); else S.boxes.delete(id); } });
  const iseen=new Set(is.data.map(r=>r.id));
  is.data.forEach(r=>S.issues.set(r.id,{...r.data,_synced:true}));
  [...S.issues.values()].forEach(i=>{ if(iseen.has(i.id)) return; if(!i._synced&&i.reporter===S.name) store.saveIssue(i).catch(()=>{}); else S.issues.delete(i.id); });
  cacheLocal(); setSync("ok");
}

    sb.channel("ny-packout").on("postgres_changes",{event:"*",schema:"public",table:"ny_boxes"},p=>{ const r=p.new&&p.new.id?p.new:null; const id=(p.new&&p.new.id)||(p.old&&p.old.id); if(!id||pending(id)) return; if(p.eventType==="DELETE") S.boxes.delete(id); else if(r) S.boxes.set(id,r.data); cacheLocal(); liveRefresh(); })
      .on("postgres_changes",{event:"*",schema:"public",table:"ny_issues"},p=>{ if(p.new&&p.new.id){ S.issues.set(p.new.id,p.new.data); cacheLocal(); liveRefresh(); } }).subscribe();
    setInterval(()=>pullAll().then(liveRefresh),20000);

function shot(setup,fn,cap,scan){
  const keep={cur:S.cur,boxes:S.boxes,issues:S.issues,name:S.name,leftover:S.leftover,undo:S.undo,issueDraft:S.issueDraft,kbd:S.kbd,lastKey:S.lastKey}; const camOn=CAM.on; CAM.on=false;
  let html="";
  try{ setup(); html=fn(); if(scan){ const H=scanPartsHTML(cur()); html=html.replace('<div id="counter"></div>',`<div>${H.counter}</div>`).replace('<div id="scanmsg"></div>',`<div>${H.msg}</div>`).replace('<div id="items" class="list"></div>',`<div class="list">${H.items}</div>`).replace('<p id="prevbatches" class="small muted"></p>',`<p class="small muted">${esc(H.prev)}</p>`).replace('class="cam" hidden','class="cam demo"'); } }
  catch(e){ html=`<p class="muted">—</p>`; }

  return `<figure class="shot"><div class="phone" aria-hidden="true"><div class="scr" inert>${html}</div></div><figcaption>${cap}</figcaption></figure>`;

function dimTxt(b){const d=b.dims;return d&&d.l?`${d.l}×${d.w}×${d.h} ${d.unit}`:L("no size","sin medidas")}
function wTxt(b){const w=b.weight;return w&&w.v?`${w.v} ${w.unit}`:L("no weight","sin peso")}
function toKg(w){return w&&w.v?(w.unit==="lb"?w.v*0.453592:w.v):0}
function totW(bs){const kg=bs.reduce((a,b)=>a+toKg(b.weight),0);return kg?`${(kg/0.453592).toFixed(1)} lb · ${kg.toFixed(1)} kg`:""}

let backTo="home";
function bind(){
  document.querySelectorAll("#app [data-a]").forEach(el=>{ if(el.dataset.bound) return; el.dataset.bound=1; el.addEventListener("click",e=>{e.preventDefault();act(el.dataset.a,el)}); });
  const sc=$("#scan"); if(sc&&!sc.dataset.bound){ sc.dataset.bound=1; sc.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); const v=sc.value; sc.value=""; if(v.trim()) onScan(v); } }); }
  const ph=$("#photoin"); if(ph&&!ph.dataset.bound){ ph.dataset.bound=1; ph.addEventListener("change",onPhoto); }
  const mn=$("#m_name"); if(mn){
    const mc=$("#m_color"), mz=$("#m_size");
    const upd=()=>{ const nv=mn.value.trim(); if(nv===mn.dataset.prev) return; mn.dataset.prev=nv; const o=BYNAME[nv]; if(!o){ mc.disabled=true; mc.innerHTML=`<option value="">${L("Choose the garment first","Primero elige la prenda")}</option>`; mz.disabled=true; mz.innerHTML=`<option value="">${L("Choose the color first","Primero elige el color")}</option>`; $("#m_sku").textContent=""; return; }
      mc.disabled=false; mc.innerHTML=`<option value="">${L("Choose…","Elige…")}</option>`+Object.keys(o).sort().map(c=>`<option>${esc(c)}</option>`).join(""); mz.disabled=true; mz.innerHTML=`<option value="">${L("Choose the color first","Primero elige el color")}</option>`; $("#m_sku").textContent=""; };
    mn.addEventListener("input",upd); mn.addEventListener("change",upd);
    mc.addEventListener("change",()=>{ const o=(BYNAME[mn.value.trim()]||{})[mc.value]; if(!o){mz.disabled=true;return} mz.disabled=false; mz.innerHTML=`<option value="">${L("Choose…","Elige…")}</option>`+SIZE_ORDER.filter(z=>o[z]).map(z=>`<option value="${z}">${szL(z)}</option>`).join(""); });
    mz.addEventListener("change",()=>{ const k=((BYNAME[mn.value.trim()]||{})[mc.value]||{})[mz.value]; $("#m_sku").textContent=k?"SKU "+k:""; });
  }
  const ii=$("#i_item"); if(ii) ii.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const p=parseCode(ii.value); if(p) ii.value=`${p.name||L("Unknown item","Prenda desconocida")} ${p.colorName} ${szL(p.sizeName)} (${p.sku})`; } });
}
function bindDyn(){ document.querySelectorAll("#items [data-a]").forEach(el=>{ if(el.dataset.bound) return; el.dataset.bound=1; el.addEventListener("click",e=>{e.preventDefault();act(el.dataset.a,el)}); }); }
function focusScan(){ if(CAM.on) return; const sc=$("#scan"); if(sc) setTimeout(()=>sc.focus({preventScroll:true}),30); }

async function act(a,el){
  const b=cur();
  switch(a){
  case "start":{ const n=$("#f_name").value.trim(); if(n.length<3){toast(L("Write your full name","Escribe tu nombre completo"),"bad");return} S.name=n;S.location="";ls.set("nyp_name",n);go("home");break}
  case "changeuser": go("welcome");break;
  case "go": go(el.dataset.v);break;
  case "helpback": go(S.prevView&&S.prevView!=="help"?S.prevView:"home"); break;
  case "back": go(backTo);break;
  case "openbox": backTo=S.view; S.viewBox=el.dataset.id; go("boxview");break;
  case "resume":{ S.cur=el.dataset.id; S.undo=[]; go(resumeView(cur())); break}
  case "takeover":{ const tb=S.boxes.get(el.dataset.id); tb.notes=(tb.notes||[]).concat(`${L("Taken over by","Tomada por")} ${S.name} ${L("from","de")} ${tb.packer} ${fmtT(now())}`); tb.packer=S.name; saveBox(tb); S.cur=tb.id; S.undo=[]; go(resumeView(tb)); break}
  case "newbox":{
    const mine=[...S.boxes.values()].find(x=>x.status!=="closed"&&x.packer===S.name); if(mine){toast(L(`Finish Box ${mine.number} first`,`Primero termina la Caja ${mine.number}`),"warn");return}
    el.disabled=true; const num=await nextBoxNumber();
    const nb={_local:true,id:"box-"+num+"-"+Math.random().toString(36).slice(2,7),number:num,packer:S.name,location:S.location,status:"open",batches:[],batch:{no:1,declared:el.dataset.decl?+el.dataset.decl:null,items:{}},items:{},restarts:0,createdAt:now(),notes:[]};
    if(el.dataset.decl) nb.notes.push(L(`Started with ${el.dataset.decl} left over from previous box`,`Empezó con ${el.dataset.decl} que sobraron de la caja anterior`));
    saveBox(nb); S.cur=nb.id; S.undo=[]; S.leftover=0; go("count"); break}
  case "cancelbox":{ if(scannedOf(b)>0||countedOf(b)>0){toast(L("Remove the scanned garments first, or restart the box","Primero quita las prendas escaneadas o reinicia la caja"),"warn");return} S.boxes.delete(b.id); try{await store.deleteBox(b.id)}catch(e){} S.cur=null; toast(L(`Box ${b.number} cancelled`,`Caja ${b.number} cancelada`),"warn"); go("home"); break}
  case "setdecl":{ const n=Math.floor(+$("#f_decl").value); if(!n||n<1){toast(L("Write how many garments you counted","Escribe cuántas prendas contaste"),"bad");return} batch(b).declared=n; b.status="open"; saveBox(b); go("scan"); break}
  case "editdecl":{ S.view="count"; render(); break}
  case "kbd": S.kbd=!S.kbd; render(); break;
  case "photo": $("#photoin").click(); break;
  case "cam": if(CAM.on) stopCam(); else startCam(); break;
  case "undo":{ const k=S.undo.pop(); if(k&&b.items[k]&&batch(b).items[k]){ removeOne(b,k); saveBox(b); toast(L("Last scan removed","Último escaneo eliminado"),"warn"); } renderScanParts(); $("[data-a=undo]").disabled=!S.undo.length; focusScan(); break}
  case "minus":{ const k=el.dataset.k; if(batch(b).items[k]){ removeOne(b,k); saveBox(b); toast(L("Removed one. Take that garment out of the box and put it back on the table","Se quitó una. Saca esa prenda de la caja y devuélvela a la mesa"),"warn",3200);} renderScanParts(); focusScan(); break}
  case "restartask": case "restartask2":{ const z=$("#restartzone"); z.innerHTML=`<div class="note bad"><b>${L("Restart batch","¿Reiniciar la tanda")} ${batch(b).no}?</b><span>${L(`This deletes the ${bScanned(b)} garments scanned in this batch only. Earlier batches and other boxes are not affected. Take the garments of this batch out of the box, put them back on the table and count again.`,`Esto borra solo las ${bScanned(b)} prendas escaneadas en esta tanda. Las tandas anteriores y las demás cajas no se tocan. Saca de la caja las prendas de esta tanda, devuélvelas a la mesa y vuelve a contar.`)}</span><div class="row"><button class="danger grow" data-a="restartyes">${L("Yes, restart the batch","Sí, reiniciar la tanda")}</button><button class="grow" data-a="restartno">${L("Cancel","Cancelar")}</button></div></div>`; bind(); z.scrollIntoView({block:"center"}); break}
  case "restartno": render(); break;
  case "restartyes":{ const bt=batch(b); Object.entries(bt.items).forEach(([k,q])=>{ for(let i=0;i<q;i++) removeOne(b,k); }); bt.items={}; bt.declared=null; b.restarts=(b.restarts||0)+1; b.status="open"; b.notes=(b.notes||[]).concat(`${L("Batch","Tanda")} ${bt.no} ${L("restarted by","reiniciada por")} ${S.name} ${fmtT(now())}`); saveBox(b); S.undo=[]; toast(L("Batch restarted. Count the table again","Tanda reiniciada. Vuelve a contar la mesa"),"warn",3000); go("count"); break}
  case "toclose": go("close"); break;
  case "backscan": go("scan"); break;
  case "todims": go("dims"); break;
  case "tobatchdone": if(b.batch&&bScanned(b)===0){ b.batch=null; saveBox(b); } go(countedOf(b)?"batchdone":"count"); break;
  case "finishbatch": finishBatch(b,0); break;
  case "dropbatch": b.batch=null; saveBox(b); go("dims"); break;
  case "addbatch":{ b.batch={no:(b.batches||[]).length+1,declared:el.dataset.decl?+el.dataset.decl:null,items:{}}; S.leftover=0; S.undo=[]; saveBox(b); go("count"); break}
  case "closepartial":{ const bt=batch(b), n=bScanned(b), left=bt.declared-n; b.notes=(b.notes||[]).concat(L(`Batch ${bt.no}: counted ${bt.declared}, scanned ${n}; ${left} left on the table`,`Tanda ${bt.no}: contadas ${bt.declared}, escaneadas ${n}; ${left} quedaron en la mesa`)); bt.declared=n; finishBatch(b,left); break}
  case "recount":{ const bt=batch(b); const r=Math.floor(+$("#f_recount").value), n=bScanned(b); if(!r){toast(L("Write the recount","Escribe el reconteo"),"bad");return} if(r!==n){ toast(L(`Recount is ${r} but ${n} are scanned. Fix the list or restart the box`,`El reconteo es ${r} pero hay ${n} escaneadas. Corrige la lista o reinicia la caja`),"bad",4000); return } b.notes=(b.notes||[]).concat(L(`Batch ${bt.no}: count changed from ${bt.declared} to ${r} after recount`,`Tanda ${bt.no}: conteo cambiado de ${bt.declared} a ${r} tras reconteo`)); bt.declared=r; finishBatch(b,0); break}
  case "unit": S.unit=el.dataset.u; ls.set("nyp_unit",S.unit); render(); break;
  case "savedims":{ const l=+$("#f_l").value,w=+$("#f_w").value,h=+$("#f_h").value,kg=+$("#f_kg").value; const u=S.unit;
    if(!(l>0&&w>0&&h>0)){toast(L("Write length, width and height","Escribe largo, ancho y alto"),"bad");return} if(!(kg>0)){toast(L("Write the weight","Escribe el peso"),"bad");return}
    const lim=u==="in"?{min:4,max:48,wmax:70,wu:"lb",du:"in"}:{min:10,max:122,wmax:32,wu:"kg",du:"cm"};
    const warns=[]; [l,w,h].forEach(x=>{ if(x<lim.min||x>lim.max) warns.push(L(`A side of ${x} ${lim.du} looks unusual for a box. Check the unit.`,`Un lado de ${x} ${lim.du} es raro para una caja. Revisa la unidad.`)) });
    if(kg>lim.wmax) warns.push(L(`${kg} ${lim.wu} is heavy. Most carriers charge extra or refuse boxes over ${lim.wmax} ${lim.wu}. Consider splitting.`,`${kg} ${lim.wu} es pesado. Muchas transportadoras cobran extra o no reciben cajas de más de ${lim.wmax} ${lim.wu}. Considera dividirla.`));
    const per=(u==="in"?kg*0.453592:kg)/Math.max(1,scannedOf(b)); if(per>1.2) warns.push(L(`That is over ${per.toFixed(1)} kg per garment. Check the weight and unit.`,`Eso da más de ${per.toFixed(1)} kg por prenda. Revisa el peso y la unidad.`));

    b.dims={l,w,h,unit:u==="in"?"in":"cm"}; b.weight={v:kg,unit:u==="in"?"lb":"kg"}; b.batch=null; b.status="closed"; b.closedAt=now(); b.closedBy=S.name; saveBox(b); beep(true); go("boxdone"); break}
  case "addmanual":{ const why=$("#m_why").value; let sku,name,cname,sz;
    const nm=$("#m_name").value.trim(), co=$("#m_color").value, z=$("#m_size").value;

      if(!name||!cname||!sz){ toast(nm?L("Choose color and size","Elige color y talla"):L("Choose the garment, color and size, or fill “Not in the list?”","Elige prenda, color y talla, o llena “¿No está en la lista?”"),"bad",3500); return; } }
    const key="M:"+(sku==="MANUAL"?[name,cname,sz].join("|").toUpperCase():sku);
    addItem(b,key,{sku,name,color:cname,size:sz,manual:true});
    const w=WHY.find(x=>x[0]===why)||WHY[0];
    const iss={id:"iss-"+now()+"-"+Math.random().toString(36).slice(2,6),type:why==="noscan"?"noscan":"notag",item:`${name} ${cname} ${sz}${sku!=="MANUAL"?" ("+sku+")":""}`,qty:1,box:b.number,notes:`${L("Added by hand","Agregada a mano")}: ${L(w[1],w[2])}`,reporter:S.name,location:S.location,createdAt:now(),auto:true};
    S.issues.set(iss.id,iss); store.saveIssue(iss).catch(()=>setSync("err","nosave"));
    toast(`${L("Added","Agregada")}: ${name} ${cname} ${szL(sz)}`); go("scan"); break}
  case "saveissue":{ const d={type:$("#i_type").value,item:$("#i_item").value.trim(),qty:Math.max(1,Math.floor(+$("#i_qty").value||1)),box:$("#i_box").value,notes:$("#i_notes").value.trim()};
    if(d.notes.length<5){ S.issueDraft=d; $("#iwarn").innerHTML=`<div class="note bad"><span>${L("Write a few words in “Details” so Colombia understands the issue.","Escribe algo en “Detalle” para que Colombia entienda la novedad.")}</span></div>`; return }
    const iss={id:"iss-"+now()+"-"+Math.random().toString(36).slice(2,6),...d,box:d.box?+d.box:null,reporter:S.name,location:S.location,createdAt:now()};
    S.issues.set(iss.id,iss); S.issueDraft=null;
    try{ await store.saveIssue(iss); toast(S.mode==="sync"?L("Issue sent to Colombia","Novedad enviada a Colombia"):L("Issue saved on this device","Novedad guardada en este celular")); }catch(e){ setSync("err","nosave"); toast(L("Saved on this phone. It will be sent when the internet returns","Guardada en este celular. Se enviará cuando vuelva el internet"),"warn"); }
    render(); break}
  case "reopenask":{ $("#reopenzone").innerHTML=`<div class="note bad"><b>${L("Reopen","¿Reabrir la")} ${BOX(S.boxes.get(S.viewBox).number)}?</b><span>${L("Only do this if you need to add garments. A new batch is opened, and you will measure and weigh the box again.","Hazlo solo si necesitas agregar prendas. Se abre una nueva tanda y tendrás que medir y pesar la caja otra vez.")}</span><div class="row"><button class="danger grow" data-a="reopenyes">${L("Yes, reopen","Sí, reabrir")}</button><button class="grow" data-a="back">${L("Cancel","Cancelar")}</button></div></div>`; bind(); break}
  case "reopenyes":{ const ob=S.boxes.get(S.viewBox); const mine=[...S.boxes.values()].find(x=>x.status!=="closed"&&x.packer===S.name); if(mine){toast(L(`Finish Box ${mine.number} first`,`Primero termina la Caja ${mine.number}`),"warn");return} ob.status="open"; ob.notes=(ob.notes||[]).concat(`${L("Reopened by","Reabierta por")} ${S.name} ${fmtT(now())}`); ob.packer=S.name; ob.closedAt=null; ob.batch={no:(ob.batches||[]).length+1,declared:null,items:{}}; saveBox(ob); S.cur=ob.id; S.undo=[]; go("count"); break}
  case "resetall":{ const pin=$("#r_pin").value.trim(), w=$("#r_word").value.trim().toUpperCase();
    if(w!=="RESET"&&w!=="REINICIAR"){ toast(L("Type RESET to confirm","Escribe REINICIAR para confirmar"),"bad"); return }
    if(!sb){ toast(L("Not connected to the server","Sin conexión al servidor"),"bad"); return }
    el.disabled=true; const {data,error}=await sb.rpc("ny_reset_all",{pin}); el.disabled=false;
    if(error){ toast(L("Reset failed. Check internet","No se pudo reiniciar. Revisa internet"),"bad"); return }
    if(data!=="ok"){ toast(L("Wrong PIN","PIN incorrecto"),"bad"); return }
    stopCam(); S.boxes.clear(); S.issues.clear(); Object.keys(wq).forEach(k=>delete wq[k]); S.cur=null; S.undo=[]; S.leftover=0; cacheLocal();
    toast(L("Everything was reset. Box numbering starts at 1","Todo quedó reiniciado. La numeración empieza en 1"),"ok",3500); go("home"); break}
  case "resetphone":{ stopCam(); try{ ["nyp_local","nyp_name","nyp_loc"].forEach(k=>localStorage.removeItem(k)); }catch(e){} S.boxes.clear(); S.issues.clear(); S.name=""; S.cur=null; S.undo=[]; if(sb) await pullAll(); toast(L("This phone was cleared","Este celular quedó limpio"),"ok"); go("welcome"); break}
  case "xlsx_all": exportXlsx(null); break;

  }

function resumeView(b){ if(b.batch) return b.batch.declared?"scan":"count"; return countedOf(b)?"batchdone":"count"; }
function removeOne(b,k){ const bt=batch(b); if(bt.items[k]){ bt.items[k]--; if(bt.items[k]<=0) delete bt.items[k]; } if(b.items[k]){ b.items[k].qty--; if(b.items[k].qty<=0) delete b.items[k]; } }
function finishBatch(b,leftover){ const bt=batch(b); b.batches.push({no:bt.no,declared:bt.declared,scanned:bScanned(b),at:now()}); b.batch=null; S.leftover=leftover||0; S.undo=[]; saveBox(b); go("batchdone"); }
function addItem(b,key,info){
  b.items=b.items||{}; const it=b.items[key]||(b.items[key]={...info,qty:0}); it.qty++; it.t=now(); const bt=batch(b); bt.items[key]=(bt.items[key]||0)+1;
  S.undo.push(key); S.lastKey=key; saveBox(b);
}
function onScan(raw){
  const b=cur(); if(!b) return;
  const code=String(raw).trim(); const t=now();
  if(code===S.lastScan.code && t-S.lastScan.t<700){ return; }
  S.lastScan={code,t};
  const p=parseCode(code);
  if(!p){ beep(false); toast(L("This is not a garment code. Scan the garment's QR, or add it by hand","Este no es un código de prenda. Escanea el QR de la prenda o agrégala a mano"),"bad",3500); return; }
  const unknown=!p.inGuide;
  addItem(b,p.sku,{sku:p.sku,name:p.name||(p.hint?p.hint+" (not in guide)":"Unknown item"),color:p.colorName,size:p.sizeName,manual:false,unknown});
  const left=batch(b).declared-bScanned(b);
  if(left<0){ beep(false); toast(L(`Over your count by ${-left}. Check for a repeated scan`,`Vas ${-left} por encima de tu conteo. Revisa si hay un escaneo repetido`),"bad",3000); }
  else if(unknown){ beep(false); toast(L(`Added, but ${p.sku} is not in the SKU guide. Report it as an issue`,`Agregada, pero ${p.sku} no está en la guía de SKU. Repórtala como novedad`),"warn",3500); }
  else { beep(true); toast(`${p.name} · ${p.colorName} · ${szL(p.sizeName)}${left===0?"  —  "+L("count reached","conteo completo"):""}`,"ok",1600); }
  renderScanParts(); const u=$("[data-a=undo]"); if(u) u.disabled=false; focusScan();
}
async function onPhoto(e){
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  if(typeof jsQR!=="function"){ toast(L("The QR reader didn't load. Reload the page","El lector de QR no cargó. Recarga la página"),"bad",3500); return; }
  toast(L("Reading QR…","Leyendo QR…"),"warn",1200);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
    let found=null;
    for(const max of [1400,900,2000]){
      const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(img,0,0,c.width,c.height); const d=x.getImageData(0,0,c.width,c.height);
      const r=jsQR(d.data,c.width,c.height,{inversionAttempts:"attemptBoth"}); if(r&&r.data){found=r.data;break}
    }
    URL.revokeObjectURL(img.src);
    if(!found){ beep(false); toast(L("Couldn't read the QR. Take the photo closer, in good light, or add it by hand","No se pudo leer el QR. Toma la foto más cerca y con buena luz, o agrégala a mano"),"bad",4000); return; }
    S.lastScan={code:"",t:0}; onScan(found);
  }catch(err){ toast(L("Couldn't open the photo. Try again","No se pudo abrir la foto. Intenta de nuevo"),"bad"); }
}

/* ---------- Live camera scanning ---------- */
const CAM={on:false,stream:null,raf:0,lastCode:"",lastSeen:0,armed:true,lastAccept:0,canvas:null,wake:null};
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast(L("This browser can't open the camera. Use Safari or Chrome, or take a photo","Este navegador no puede abrir la cámara. Usa Safari o Chrome, o toma una foto"),"bad",4000); return; }
  if(typeof jsQR!=="function"){ toast(L("The QR reader didn't load. Reload the page","El lector de QR no cargó. Recarga la página"),"bad"); return; }
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    const m=e&&e.name==="NotAllowedError"?L("Camera blocked. Allow camera access for this site in the browser settings, then try again","Cámara bloqueada. Permite el acceso a la cámara para este sitio en los ajustes del navegador e intenta de nuevo"):L("Couldn't open the camera. Close other apps using it and try again","No se pudo abrir la cámara. Cierra otras apps que la estén usando e intenta de nuevo");
    toast(m,"bad",5000); return;
  }
  CAM.on=true; CAM.armed=true; CAM.lastCode="";
  try{ CAM.wake=await navigator.wakeLock.request("screen"); }catch(e){}
  attachCam(); const b=$("#cambtn"); if(b) b.textContent=L("Stop camera","Apagar cámara");
}
function attachCam(){
  const v=$("#cam"), w=$("#camwrap"); if(!v||!CAM.stream) return;
  w.hidden=false; v.srcObject=CAM.stream; v.play().catch(()=>{});
  cancelAnimationFrame(CAM.raf); let lastT=0;
  const loop=t=>{ CAM.raf=requestAnimationFrame(loop); if(t-lastT<110) return; lastT=t; tick(v); };
  CAM.raf=requestAnimationFrame(loop);
}
function stopCam(){
  cancelAnimationFrame(CAM.raf); if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); } CAM.stream=null; CAM.on=false;
  try{ CAM.wake&&CAM.wake.release(); }catch(e){} CAM.wake=null;
  const w=$("#camwrap"); if(w) w.hidden=true; const b=$("#cambtn"); if(b) b.textContent=L("Scan with camera","Escanear con la cámara");
}
function tick(v){
  if(!v.videoWidth) return;
  const W=640, sc=W/v.videoWidth, H=Math.round(v.videoHeight*sc);
  const c=CAM.canvas||(CAM.canvas=document.createElement("canvas")); c.width=W; c.height=H;
  const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(v,0,0,W,H);
  const r=jsQR(x.getImageData(0,0,W,H).data,W,H,{inversionAttempts:"dontInvert"});
  const t=now(); const hint=$("#camhint");
  if(r&&r.data){
    CAM.lastSeen=t;
    const same=r.data===CAM.lastCode;
    if(CAM.armed && t-CAM.lastAccept>800){
      CAM.armed=false; CAM.lastCode=r.data; CAM.lastAccept=t;
      const w=$("#camwrap"); if(w){ w.classList.add("hit"); setTimeout(()=>w.classList.remove("hit"),350); }
      S.lastScan={code:"",t:0}; onScan(r.data);
      if(hint) hint.textContent=L("Got it. Move it away, then show the next one","Listo. Retírala y muestra la siguiente");
    } else if(!same && t-CAM.lastAccept>800){ CAM.armed=true; }
  } else if(!CAM.armed && t-CAM.lastSeen>600){
    CAM.armed=true; if(hint) hint.textContent=L("Hold one QR inside the frame","Pon un solo QR dentro del recuadro");
  }
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&CAM.on){ stopCam(); } });

async function exportXlsx(person){
  if(typeof XLSX==="undefined"){ toast(L("Excel tool didn't load. Reload the page","La herramienta de Excel no cargó. Recarga la página"),"bad"); return; }

  const bx=[[L("Box","Caja"),L("Status","Estado"),L("Packed by","Empacó"),L("Batches","Tandas"),L("Counted","Contadas"),L("Scanned","Escaneadas"),L("Difference","Diferencia"),L("Length (cm)","Largo (cm)"),L("Width (cm)","Ancho (cm)"),L("Height (cm)","Alto (cm)"),L("Weight (kg)","Peso (kg)"),L("Length (in)","Largo (in)"),L("Width (in)","Ancho (in)"),L("Height (in)","Alto (in)"),L("Weight (lb)","Peso (lb)"),L("Restarts","Reinicios"),L("Started","Inicio"),L("Closed","Cierre"),L("Notes","Notas")]];
  boxes.forEach(b=>{const d=b.dims||{};const n=scannedOf(b);bx.push([b.number,st(b.status),b.packer,(b.batches||[]).length,countedOf(b),n,countedOf(b)-n,cm(d.l,d.unit),cm(d.w,d.unit),cm(d.h,d.unit),kg(b.weight),inch(d.l,d.unit),inch(d.w,d.unit),inch(d.h,d.unit),lb(b.weight),b.restarts||0,fmtT(b.createdAt),fmtT(b.closedAt),(b.notes||[]).join(" | ")])});
  const agg={}; boxes.forEach(b=>Object.values(b.items||{}).forEach(i=>{const k=i.sku+"|"+i.name+"|"+i.color+"|"+i.size;const a=agg[k]||(agg[k]={sku:i.sku,name:i.name,color:i.color,size:i.size,qty:0,boxes:new Set()});a.qty+=i.qty;a.boxes.add(b.number)}));
  const bs=[["SKU",L("Garment","Prenda"),L("Color","Color"),L("Size","Talla"),L("Total qty","Cantidad total"),L("In boxes","En cajas")]]; Object.values(agg).sort((x,y)=>x.name.localeCompare(y.name)||x.color.localeCompare(y.color)).forEach(a=>bs.push([a.sku,a.name,a.color,szL(a.size),a.qty,[...a.boxes].sort((x,y)=>x-y).join(", ")]));
  const is=[[L("Date","Fecha"),L("Reported by","Reportó"),L("Type","Tipo"),L("Garment","Prenda"),L("Qty","Cantidad"),L("Box","Caja"),L("Details","Detalle"),L("Automatic","Automática")]]; issues.forEach(i=>is.push([fmtT(i.createdAt),i.reporter,issueLabel(i.type),i.item||"",i.qty,i.box||"",i.notes,i.auto?Y:""]));
  const closed=boxes.filter(b=>b.status==="closed");
  const sm=[["NY Pack-Out — "+(person?L("summary for ","resumen de ")+person:L("all boxes","todas las cajas"))],[L("Generated","Generado"),fmtT(now())],[L("Boxes closed","Cajas cerradas"),closed.length],[L("Boxes still open","Cajas abiertas"),boxes.length-closed.length],[L("Garments in closed boxes","Prendas en cajas cerradas"),closed.reduce((a,b)=>a+scannedOf(b),0)],[L("Garments in open boxes","Prendas en cajas abiertas"),boxes.filter(b=>b.status!=="closed").reduce((a,b)=>a+scannedOf(b),0)],[L("Total weight (kg)","Peso total (kg)"),+closed.reduce((a,b)=>a+toKg(b.weight),0).toFixed(2)],[L("Issues reported","Novedades reportadas"),issues.length]];
  const wb=XLSX.utils.book_new();
  const add=(rows,name,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add(sm,L("Summary","Resumen"),[28,24]); add(pl,L("Packing list","Lista de empaque"),[6,8,18,13,30,14,8,8,12,12]); add(bx,L("Boxes","Cajas"),[6,8,18,8,8,10,10,11,11,11,11,11,11,11,11,8,16,16,50]); add(bs,L("By SKU","Por SKU"),[13,30,14,8,12,20]); add(is,L("Issues","Novedades"),[16,18,22,30,8,6,50,10]);
  const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
